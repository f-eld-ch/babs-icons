name: Publish

on:
  push:
    tags:
      - 'v[0-9]*'   # matches v1.0.0, v2.3.4, etc.

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TZ: UTC
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@f-eld-ch"

      - run: corepack enable

      - name: Extract version from tag
        id: version
        # GITHUB_REF_NAME is e.g. "v1.2.3"; strip the leading "v" for npm
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set version in all publishable packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pkg in packages/core packages/react packages/sprites packages/assets packages/svg; do
            npm pkg set version="$VERSION" --prefix "$pkg"
          done

      - name: Build
        run: yarn build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in packages/core packages/react packages/sprites packages/assets packages/svg; do
            (cd "$pkg" && npm publish)
          done
