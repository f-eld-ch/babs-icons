name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  icons-check:
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: yarn install --immutable

      - name: Rebuild icons
        run: yarn icons:rebuild

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn fmt:check

      - name: Check for uncommitted changes
        run: |
          # Sprite PNGs and pixel hashes are excluded: resvg/libvips produce different
          # bytes across platforms, so these cannot be compared in CI. The sprite JSON
          # manifests and layout.lock.json are deterministic and are checked below.
          git diff --exit-code \
            -- ':(exclude)packages/sprites/dist/*.png' \
               ':(exclude)packages/sprites/pixels.sha256.json' \
            || {
              echo "Generated files are out of date. Run 'yarn icons:rebuild' locally and commit the result."
              git diff --name-only \
                -- ':(exclude)packages/sprites/dist/*.png' \
                   ':(exclude)packages/sprites/pixels.sha256.json'
              exit 1
            }
