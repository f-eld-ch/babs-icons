name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  icons-check:
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Rebuild icons
        run: yarn icons:rebuild

      - name: Check for uncommitted changes
        run: |
          # Exclude sprite PNGs — libvips produces different bytes across platforms/versions.
          # Correctness is verified via pixels.sha256.json (pixel hashes) instead.
          git diff --exit-code -- ':(exclude)*.png' || {
            echo "Generated files are out of date. Run 'yarn icons:rebuild' locally and commit the result."
            git diff --name-only -- ':(exclude)*.png'
            exit 1
          }
